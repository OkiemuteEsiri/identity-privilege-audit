name: Identity Privilege Audit CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run synthetic smoke assessment
        run: python src/cli.py data/synthetic_identities.json > /tmp/identity-audit.json
